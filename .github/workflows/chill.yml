name: Chill

on:
  workflow_dispatch:
    inputs:
      rdp_username:
        description: "Username for the RDP/SSH session"
        required: true
        default: "Neon"
        type: string
      rdp_password:
        description: "Password for RDP/SSH (Must meet Windows Server complexity requirements)"
        required: true
        type: string
      rdp_language:
        description: "System and Display Language for the Workspace"
        required: true
        default: "en-US"
        type: choice
        options:
          - "en-US" # English (United States)
          - "fr-FR" # French (France)
          - "es-ES" # Spanish (Spain)
      rdp_timeout:
        description: "Session timeout allocation in minutes (Max: 350 min / 5h50)"
        required: true
        default: "350"
        type: string
      node_version:
        description: "Node.js Environment Architecture Upgrade"
        required: true
        default: "22"
        type: choice
        options:
          - "22" # Current Stable Long-Term Support
          - "24" # Node 24 Infrastructure Standard
          - "20" # Legacy Compatibility Layer
      java_version:
        description: "Java JDK Environment Architecture Upgrade (Android Development)"
        required: true
        default: "17"
        type: choice
        options:
          - "17" # Standard LTS for modern Android Studio
          - "21" # Next-Gen Enterprise OpenJDK
          - "11" # Legacy Android Compatibility
      ssh_shell:
        description: "Default shell for the SSH session"
        required: true
        default: "powershell"
        type: choice
        options:
          - "powershell"
          - "cmd"

      # ==========================================
      # LOCKS & DEPENDENCY ENGINES (BOOLEANS)
      # ==========================================
      install_ssh_sftp:
        description: "Install and Configure OpenSSH & SFTP Server"
        required: false
        default: false
        type: boolean
      install_claude_code:
        description: "Install Custom Claude Code CLI Utility"
        required: false
        default: false
        type: boolean
      install_ghgrab:
        description: "Install ghgrab via pipx toolset"
        required: false
        default: false
        type: boolean
      install_ollama:
        description: "Install Ollama Local AI Infrastructure"
        required: false
        default: false
        type: boolean
      install_php:
        description: "Install PHP Runtime Environment"
        required: false
        default: false
        type: boolean
      install_docker:
        description: "Install Docker Desktop Infrastructure Engine"
        required: false
        default: false
        type: boolean

      # ==========================================
      # BULK LOADING ZONE (50+ APPS)
      # ==========================================
      custom_winget_apps:
        description: "List of Apps to deploy via Winget, separated by spaces (Leave empty to install nothing)"
        required: false
        type: string
        default: ""

# ========================================================
# 🔒 INFRASTRUCTURE SECURITY: LEAST-PRIVILEGE PERMISSIONS
# ========================================================
permissions:
  contents: read   # The server can read the code but cannot modify anything on your GitHub
  actions: read    # Read-only access to statuses

jobs:
  secure-rdp:
    # 🔒 REPOSITORY LOCK: Refuse to run on third-party forks
    if: github.repository == 'JCVERSA/KWEPING-space'
    runs-on: windows-2025

    # 🔒 APPROVAL LOCK: Requires manual approval via the Production environment
    environment: Production

    # Strict dynamic allocation limit
    timeout-minutes: 360

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Mask sensitive inputs"
        shell: powershell
        run: |
          # Mask credentials in logs. The password is passed via env (not interpolated
          # into the PowerShell source) so that PowerShell metacharacters such as $, ", `,
          # and \ cannot cause injection or parsing failures.
          if ($env:RDP_PASS) { echo "::add-mask::$env:RDP_PASS" }
        env:
          RDP_PASS: ${{ inputs.rdp_password }}

      - name: "Initialize Environment"
        shell: powershell
        run: |
          .\scripts\Initialize-Environment.ps1 -RdpLanguage "$env:RDP_LANG"
        env:
          RDP_LANG: ${{ inputs.rdp_language }}

      # ==========================================
      # 2. RESTORATION AND SAVING OF CACHES
      # ==========================================
      - name: "Cache 1: Personal Projects & Sites"
        uses: actions/cache@v4
        with:
          path: D:\RDP_Data\Projects
          key: rdp-projects-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: rdp-projects-
          save-always: true

      - name: "Cache 2: Persistent Firefox Profile"
        uses: actions/cache@v4
        with:
          path: D:\RDP_Data\FirefoxProfile
          key: rdp-firefox-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: rdp-firefox-
          save-always: true

      - name: "Cache 3: Android Gradle Dependencies"
        uses: actions/cache@v4
        with:
          path: D:\RDP_Data\AndroidConfig\.gradle
          key: rdp-gradle-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: rdp-gradle-
          save-always: true

      - name: "Cache 4: Android Studio Config & SDK"
        uses: actions/cache@v4
        with:
          path: D:\RDP_Data\AndroidConfig
          key: rdp-android-studio-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: rdp-android-studio-
          save-always: true

      # ==========================================
      # 3. RUNTIME DEPLOYMENT (NODE & JAVA)
      # ==========================================
      - name: "Deploy Selected Runtime: Node.js v${{ inputs.node_version }}"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: "Deploy Selected Runtime: Java OpenJDK v${{ inputs.java_version }}"
        uses: actions/setup-java@v4
        with:
          distribution: "microsoft"
          java-version: ${{ inputs.java_version }}

      # ==========================================
      # 3.4 SSH / SFTP SERVER DEPLOYMENT
      # ==========================================
      - name: "Provision OpenSSH & SFTP Server Engine"
        if: ${{ inputs.install_ssh_sftp == true }}
        shell: powershell
        run: |
          Write-Host "[SSH] Installing native OpenSSH Server feature..." -ForegroundColor Cyan
          Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0

          Write-Host "[SSH] Configuring and starting sshd services..." -ForegroundColor Cyan
          Start-Service sshd
          Set-Service -Name sshd -StartupType 'Automatic'

          # Port 22 open only for Tailscale IP range (Zero Trust Security)
          Write-Host "[SSH] Securing firewall rules for Tailscale ecosystem..." -ForegroundColor Cyan
          netsh advfirewall firewall delete rule name="SSH-SFTP-Tailscale" 2>$null
          netsh advfirewall firewall add rule name="SSH-SFTP-Tailscale" dir=in action=allow protocol=TCP localport=22 remoteip=100.64.0.0/10

          # Configuring default shell
          $shellChoice = $env:SSH_SHELL
          Write-Host "[SSH] Configuring default shell to: $shellChoice" -ForegroundColor Cyan

          $shellExe = if ($shellChoice -eq "powershell") { "powershell.exe" } else { "cmd.exe" }
          $shellPath = (Get-Command $shellExe).Source

          if (-not (Test-Path "HKLM:\SOFTWARE\OpenSSH")) {
              New-Item -Path "HKLM:\SOFTWARE\OpenSSH" -Force | Out-Null
          }
          New-ItemProperty -Path "HKLM:\SOFTWARE\OpenSSH" -Name "DefaultShell" -Value $shellPath -PropertyType String -Force
          Restart-Service sshd -Force

          Write-Host "[SUCCESS] OpenSSH and SFTP endpoint is ready on port 22." -ForegroundColor Green
        env:
          SSH_SHELL: ${{ inputs.ssh_shell }}

      # ==========================================
      # 3.5 CUSTOM ARCHITECT TOOLS DEPLOYMENT
      # ==========================================
      - name: "Provision Custom Architect Tools"
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'

          # 1. Custom Claude Code Installation (pinned by commit SHA for supply-chain safety).
          if ($env:INSTALL_CLAUDE -eq "true") {
              Write-Host "[INSTALL] Deploying Claude Code CLI (pinned commit)..." -ForegroundColor Cyan
              # NOTE: If you wish to pin by SHA-256, compute the file hash of the pinned
              # script and pass it via -ExpectedSha256 to Invoke-RemoteScript.ps1.
              & .\scripts\Invoke-RemoteScript.ps1 `
                  -Uri "https://raw.githubusercontent.com/Alishahryar1/free-claude-code/261b12f96499e46a7f66bc596e22968bf0f3372f/scripts/install.ps1" `
                  -Description "free-claude-code installer (pinned SHA)"
          }

          # 2. ghgrab installation via pipx
          if ($env:INSTALL_GHGRAB -eq "true") {
              Write-Host "[INSTALL] Deploying ghgrab via pipx..." -ForegroundColor Cyan
              if (-not (Get-Command pipx -ErrorAction SilentlyContinue)) {
                  Write-Host "[INFO] pipx not found on PATH; bootstrapping via python -m pip." -ForegroundColor Cyan
                  python -m pip install --user pipx
                  python -m pipx ensurepath
                  # Refresh PATH for this session
                  $env:Path = [Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [Environment]::GetEnvironmentVariable("Path", "User")
              }
              pipx install ghgrab
          }

          # 3. Ollama Installation
          if ($env:INSTALL_OLLAMA -eq "true") {
              Write-Host "[INSTALL] Deploying Ollama Local Engine..." -ForegroundColor Cyan
              # Download-then-execute instead of irm | iex; same supply-chain caveat applies,
              # but avoids directly piping the network stream into Invoke-Expression.
              & .\scripts\Invoke-RemoteScript.ps1 `
                  -Uri "https://ollama.com/install.ps1" `
                  -Description "Ollama installer (upstream latest)"
          }

          # 4. PHP Environment Deployment
          if ($env:INSTALL_PHP -eq "true") {
              Write-Host "[INSTALL] Deploying PHP Environment..." -ForegroundColor Cyan
              winget install --silent --accept-source-agreements --accept-package-agreements PHP.PHP
          }

          # 5. Docker Desktop Installation
          if ($env:INSTALL_DOCKER -eq "true") {
              Write-Host "[INSTALL] Deploying Docker Desktop Infrastructure..." -ForegroundColor Cyan
              winget install --silent --accept-source-agreements --accept-package-agreements Docker.DockerDesktop
              Write-Host "[VERIFY] Checking Docker CLI availability..." -ForegroundColor Cyan
              $dockerBin = Get-Command docker -ErrorAction SilentlyContinue
              if ($dockerBin) {
                  Write-Host "[INFO] docker CLI installed at: $($dockerBin.Source)" -ForegroundColor Green
              } else {
                  Write-Host "[WARNING] Docker CLI not on PATH after install; Docker Desktop may require a reboot / WSL2 enablement on hosted runners." -ForegroundColor Yellow
              }
          }
        env:
          INSTALL_CLAUDE: ${{ inputs.install_claude_code }}
          INSTALL_GHGRAB: ${{ inputs.install_ghgrab }}
          INSTALL_OLLAMA: ${{ inputs.install_ollama }}
          INSTALL_PHP: ${{ inputs.install_php }}
          INSTALL_DOCKER: ${{ inputs.install_docker }}

      # ==========================================
      # 3.6 BULK DEPLOYMENT (WINGET)
      # ==========================================
      - name: "Bulk Applications Delivery"
        shell: powershell
        run: |
          winget source update --disable-interactivity
          $appsString = $env:WINGET_APPS.Trim()
          if (-not [string]::IsNullOrEmpty($appsString)) {
              $apps = $appsString -split "\s+"
              Write-Host "[WINGET] Bulk execution triggered for $($apps.Count) applications." -ForegroundColor Cyan
              foreach ($app in $apps) {
                  if (-not [string]::IsNullOrEmpty($app)) {
                      Write-Host "Installing Package: $app" -ForegroundColor Cyan
                      winget install --silent --accept-source-agreements --accept-package-agreements --id $app
                      if ($LASTEXITCODE -ne 0) {
                          Write-Host "[WARNING] Failed to install $app. Winget exited with code $LASTEXITCODE" -ForegroundColor Yellow
                      }
                  }
              }
          } else {
              Write-Host "[WINGET] No custom apps provided. Skipping execution step." -ForegroundColor Yellow
          }
        env:
          WINGET_APPS: ${{ inputs.custom_winget_apps }}

      - name: "Configure RDP"
        shell: powershell
        run: |
          .\scripts\Setup-RDP.ps1

      - name: "Create RDP User"
        shell: powershell
        run: |
          .\scripts\Manage-User.ps1 -Username "$env:RDP_USERNAME"
        env:
          RDP_USERNAME: ${{ inputs.rdp_username }}
          RDP_PASS: ${{ inputs.rdp_password }}

      - name: "Establish Tailscale Connection"
        shell: powershell
        run: |
          # ExpectedSha256 is intentionally left empty until an operator pins the
          # SHA-256 of tailscale-setup-1.82.0-amd64.msi; the script will log a
          # warning and proceed. Populate -ExpectedSha256 to enable hard-fail
          # integrity verification.
          # AuthKey and Hostname are provided via env vars (TAILSCALE_AUTH_KEY,
          # TAILSCALE_HOSTNAME) so the secret never appears in the command line.
          .\scripts\Install-Tailscale.ps1 -Version "1.82.0"
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          TAILSCALE_HOSTNAME: gh-runner-${{ github.run_id }}

      # ==========================================
      # 8. CONNECTION MAINTENANCE AND EXIT SCRIPT
      # ==========================================
      - name: "Maintain Connection Loop"
        shell: powershell
        run: |
          $timeoutMinutes = 0
          if (-not [int]::TryParse($env:RDP_TIMEOUT, [ref]$timeoutMinutes)) { $timeoutMinutes = 350 }
          .\scripts\Maintain-Connection.ps1 `
              -Username $env:RDP_USERNAME `
              -TimeoutMinutes $timeoutMinutes `
              -Language $env:RDP_LANG `
              -NodeVersion $env:NODE_VERSION `
              -JavaVersion $env:JAVA_VERSION `
              -SshEnabled ($env:SSH_ENABLED -eq "true") `
              -SshShell $env:SSH_SHELL `
              -PasswordDisplay "[REDACTED]"
        env:
          RDP_USERNAME: ${{ inputs.rdp_username }}
          RDP_TIMEOUT: ${{ inputs.rdp_timeout }}
          RDP_LANG: ${{ inputs.rdp_language }}
          NODE_VERSION: ${{ inputs.node_version }}
          JAVA_VERSION: ${{ inputs.java_version }}
          SSH_ENABLED: ${{ inputs.install_ssh_sftp }}
          SSH_SHELL: ${{ inputs.ssh_shell }}

      # ==========================================
      # 9. STREAM CLEANUP AND MACHINE SHUTDOWN
      # ==========================================
      - name: "Cleanup Environment"
        if: always()
        shell: powershell
        run: |
          .\scripts\Cleanup.ps1
