---
extends: default

rules:
  # GitHub Actions workflows have legitimate long shell lines, comments, and
  # the `on:` key is a YAML-1.1 boolean that Actions requires as-is.
  line-length:
    max: 120
  truthy:
    allowed-keys: ["on"]
  comments:
    min-spaces-from-content: 1
  document-start: disable
